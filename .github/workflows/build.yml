name: Build and Test (Windows, Linux, and Mac)

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  linux:
    name: Linux
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  macos:
    name: macOS
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  windows:
    name: Windows
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

name: SDK Bootstrap Check

on:
  schedule:
    # 06:00 UTC on the 1st of each month.
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  bootstrap-check:
    name: Verify pinned cmdline-tools on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up CMake
        if: matrix.os != 'windows-latest'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.0'

      - name: Install host dependencies
        shell: bash
        run: bash ./.github/scripts/shared-install-host-deps.sh

      - name: Configure CMake
        shell: bash
        env:
          BUILD_TYPE: Release
          BUILD_TESTS: 'true'
        run: bash ./.github/scripts/shared-configure-cmake.sh

      - name: Build tests
        run: cmake --build build --config Release --target coredeck_tests --parallel

      - name: Download and verify the pinned archive
        env:
          COREDECK_TEST_NETWORK: '1'
        run: ctest --test-dir build --build-config Release -L network --output-on-failure

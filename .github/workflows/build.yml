name: Build & Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      matrix:
        os: [ windows-latest, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm ]
        build_type: [ Release ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up CMake
        if: matrix.os != 'windows-latest'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.0'

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gettext libcurl4-openssl-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Install gettext (macOS)
        if: runner.os == 'macOS'
        run: brew install gettext

      - name: Install gettext (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "gettext[tools]:x64-windows"

      - name: Configure CMake
        env:
          COREDECK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cmake_args=(-B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCOREDECK_BUILD_TESTS=ON)
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            case "$(uname -m)" in
              x86_64) cmake_args+=(-DCMAKE_OSX_ARCHITECTURES=x86_64) ;;
              arm64) cmake_args+=(-DCMAKE_OSX_ARCHITECTURES=arm64) ;;
            esac
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cmake_args+=(-DCMAKE_PREFIX_PATH="$VCPKG_INSTALLATION_ROOT/installed/x64-windows")
          fi
          cmake "${cmake_args[@]}"
        shell: bash

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coredeck-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            build/CoreDeck*
            build/assets/
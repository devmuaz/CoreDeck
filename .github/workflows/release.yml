name: Release (Windows, Linux, and Mac)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      matrix:
        include:
          # TEMP: Linux + Windows disabled while validating the macOS DMG polish.
          # Re-enable these entries before the next non-beta release.
          # - os: ubuntu-latest
          #   artifact_name: coredeck-linux-x86-64
          #   asset_name: coredeck-linux-x86-64.tar.gz
          # - os: ubuntu-24.04-arm
          #   artifact_name: coredeck-linux-arm64
          #   asset_name: coredeck-linux-arm64.tar.gz
          # - os: windows-latest
          #   artifact_name: coredeck-windows-x86-64
          #   asset_name: coredeck-windows-x86-64
          - os: macos-latest
            artifact_name: coredeck-darwin-arm64
            asset_name: coredeck-darwin-arm64.dmg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up CMake
        if: matrix.os != 'windows-latest'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.0'

      - name: Setup ccache
        if: matrix.os != 'windows-latest'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.artifact_name }}

      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Configure CMake
        # NOTE: COREDECK_SENTRY_DSN must be the public client DSN (safe to ship in binaries),
        # not a server-side auth token.
        env:
          COREDECK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          COREDECK_VERSION_REF: ${{ github.ref_name }}
        run: |
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            export CMAKE_C_COMPILER_LAUNCHER=ccache
            export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCOREDECK_SENTRY_DSN="$COREDECK_SENTRY_DSN" \
            -DCOREDECK_VERSION_OVERRIDE="$COREDECK_VERSION_REF"
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package artifacts (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p release/${{ matrix.artifact_name }}
          cp build/CoreDeck release/${{ matrix.artifact_name }}/
          cp -r build/assets release/${{ matrix.artifact_name }}/
          cd release
          tar -czf ${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Setup Apple Developer Signing (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          security create-keychain -p "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" build.keychain
          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" build.keychain
          echo "CERTIFICATE_NAME=$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_ENV

      - name: Package and Sign (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          APP_PATH="build/CoreDeck.app"

          # Sign every nested Mach-O file first (replaces deprecated --deep).
          # Detect Mach-O by content, not extension, so we cover bundled helpers
          # like sentry-native's crashpad_handler that have no .dylib suffix.
          while IFS= read -r -d '' f; do
            if file -b "$f" 2>/dev/null | grep -q "Mach-O"; then
              codesign --force --options runtime --sign "$CERTIFICATE_NAME" "$f"
            fi
          done < <(find "$APP_PATH" -type f -print0)

          # Sign nested .framework bundles, if any.
          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              codesign --force --options runtime --sign "$CERTIFICATE_NAME" "$f"
            done < <(find "$APP_PATH/Contents/Frameworks" -maxdepth 1 -type d -name "*.framework")
          fi

          # Then sign the outer bundle.
          codesign --force --options runtime --sign "$CERTIFICATE_NAME" "$APP_PATH"

          # Sanity-check the signature before packaging.
          codesign --verify --strict --verbose=2 "$APP_PATH"

          # Build the .dmg containing the signed .app via CPack (DragNDrop).
          mkdir -p release
          cd build
          cpack -G DragNDrop
          cd ..
          # CPack produces a versioned filename (e.g. CoreDeck-1.2.3-Darwin.dmg);
          # grab whichever .dmg it created and rename to our stable asset name.
          DMG_BUILT=$(ls build/*.dmg | head -n 1)
          mv "$DMG_BUILT" "release/${{ matrix.asset_name }}"

          # Sign the .dmg itself, then notarize and staple it.
          codesign --force --sign "$CERTIFICATE_NAME" "release/${{ matrix.asset_name }}"

          # Submit and capture the JSON output so we can fetch the log on failure.
          set +e
          NOTARY_OUTPUT=$(xcrun notarytool submit "release/${{ matrix.asset_name }}" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait \
            --output-format json)
          NOTARY_EXIT=$?
          set -e
          echo "$NOTARY_OUTPUT"

          NOTARY_STATUS=$(echo "$NOTARY_OUTPUT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
          NOTARY_ID=$(echo "$NOTARY_OUTPUT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")

          if [ "$NOTARY_STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed (status=$NOTARY_STATUS). Fetching log:"
            if [ -n "$NOTARY_ID" ]; then
              xcrun notarytool log "$NOTARY_ID" \
                --apple-id "${{ secrets.APPLE_ID }}" \
                --password "${{ secrets.APPLE_PASSWORD }}" \
                --team-id "${{ secrets.APPLE_TEAM_ID }}" || true
            fi
            exit ${NOTARY_EXIT:-1}
          fi

          xcrun stapler staple "release/${{ matrix.asset_name }}"

      - name: Install WiX Toolset (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install wixtoolset

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          cd build
          cpack -G ZIP
          cpack -G WIX
          mkdir ..\release
          for %%i in (*.msi) do copy "%%i" "..\release\coredeck-windows-x86-64.msi"
          for %%i in (*.zip) do copy "%%i" "..\release\coredeck-windows-x86-64.zip"

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/coredeck-windows-x86-64.msi
            release/coredeck-windows-x86-64.zip

      - name: Upload artifacts (Linux and macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.asset_name }}

  create-release:
    name: Create GitHub Release
    needs: build-and-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            sha256sum "$f" > "${f}.sha256"
          done < <(find . -type f \( -name '*.tar.gz' -o -name '*.msi' -o -name '*.zip' -o -name '*.dmg' \))

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CoreDeck ${{ steps.version.outputs.version }}
          body: |
            ## CoreDeck ${{ steps.version.outputs.version }}

            > This is a **macOS-only beta** for verifying the DMG layout polish. Windows and Linux builds will return in the next release.

            Download the appropriate version for your platform:

            **macOS (Apple Silicon):** `coredeck-darwin-arm64.dmg`

            Each artifact has an accompanying `.sha256` file for download verification.

            ### Installation
            **macOS:** Open the DMG and drag `CoreDeck.app` into your Applications folder.

            ### Troubleshooting (macOS)
            If the app won't open after copying it out of the DMG, remove the quarantine attribute:
            ```bash
            xattr -cr /Applications/CoreDeck.app
            ```
          files: |
            artifacts/**/coredeck-*.msi
            artifacts/**/coredeck-*.zip
            artifacts/**/coredeck-*.tar.gz
            artifacts/**/coredeck-*.dmg
            artifacts/**/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Release Windows

on:
  workflow_call:
    secrets:
      SENTRY_DSN:
        required: false

jobs:
  build:
    name: coredeck-windows-x86-64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure and build
        uses: ./.github/actions/cmake-build
        with:
          build-type: Release
          version-ref: ${{ github.ref_name }}
          sentry-dsn: ${{ secrets.SENTRY_DSN }}

      - name: Package artifacts (Windows)
        shell: pwsh
        run: ./.github/scripts/windows-packaging.ps1

      - name: Verify Windows zip contains libintl
        shell: pwsh
        run: ./.github/scripts/windows-verify-zip.ps1

      - name: Upload artifacts (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: coredeck-windows-x86-64
          path: |
            release/coredeck-windows-x86-64.msi
            release/coredeck-windows-x86-64.zip

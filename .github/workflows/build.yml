name: Build and Test (Windows, Linux, and Mac)

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  structure_format_tidy:
    name: Structure, format, and tidy
    uses: ./.github/workflows/structure-format-tidy.yml

  linux:
    name: Linux
    needs: structure_format_tidy
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  macos:
    name: macOS
    needs: structure_format_tidy
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  windows:
    name: Windows
    needs: structure_format_tidy
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
